name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Go test
        env:
          POSTGRES_PASSWORD: test
          MIGRATIONS_DIR: ./db/migrations
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...
          go vet ./...
          go build ./cmd/app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Frontend build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm install --ignore-scripts
          npm run lint
          npm run build

      - name: Prepare runtime environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_PASSWORD=change_me/POSTGRES_PASSWORD=test/' .env
          docker compose config --quiet

      - name: Build runtime images
        run: docker compose build backend frontend

      - name: Runtime smoke test
        run: |
          set -euo pipefail
          trap 'docker compose ps || true; docker compose logs --tail=200 postgres manticore backend frontend nginx || true' ERR
          docker compose up -d postgres manticore

          for i in $(seq 1 30); do
            pg_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$(docker compose ps -q postgres)" 2>/dev/null || true)
            mc_status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$(docker compose ps -q manticore)" 2>/dev/null || true)
            if [ "$pg_status" = healthy ] && [ "$mc_status" = healthy ]; then
              break
            fi
            if [ "$pg_status" = unhealthy ] || [ "$mc_status" = unhealthy ]; then
              echo "postgres=$pg_status manticore=$mc_status"
              docker inspect -f '{{json .State.Health}}' "$(docker compose ps -q manticore)" || true
              docker compose exec -T manticore sh -lc 'command -v mysql || true; command -v searchd || true; mysql -h127.0.0.1 -P9306 -e "SHOW STATUS" || true' || true
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q postgres)")" = healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q manticore)")" = healthy

          docker compose run --rm backend migrate
          docker compose up -d backend frontend nginx
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/health/live >/dev/null && curl -fsS http://127.0.0.1/health/ready >/dev/null; then
              curl -fsS http://127.0.0.1/health/ready
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Cleanup runtime
        if: always()
        run: docker compose down -v --remove-orphans || true
