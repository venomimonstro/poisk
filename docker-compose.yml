services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poisk}
      POSTGRES_USER: ${POSTGRES_USER:-poisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poisk} -d ${POSTGRES_DB:-poisk}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  manticore:
    image: manticoresearch/manticore:29.9.0
    restart: unless-stopped
    volumes:
      - manticore_data:/var/lib/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9306 -e 'SHOW STATUS' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MAP_ARTIFACT_ROOT: /maps
      ORG_IMPORT_ROOT: /imports
      ADDRESS_IMPORT_ROOT: /address-imports
    volumes:
      - ./data/maps:/maps:ro
      - ./data/imports:/imports:ro
      - ./data/address-imports:/address-imports:ro
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5

  indexer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["indexer"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  webmaster-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["webmaster-worker"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75

  organizations-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["organizations-worker"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75

  organization-indexer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["organization-indexer"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75

  address-indexer:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["address-indexer"]
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75

  resource-monitor:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["resource-monitor"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RESOURCE_DISK_PATH: /data-watch
    volumes:
      - ./:/data-watch:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: 0.20

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://backend:8080
    depends_on:
      - backend
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/maps:/maps:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

  backup:
    image: postgres:18-bookworm
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      BACKUP_ROOT: /backups
    command: ["sh", "/ops/backup.sh"]
    volumes:
      - ./deploy/backup:/ops:ro
      - ./data/backups:/backups
      - ./docker-compose.yml:/safe-config/docker-compose.yml:ro
      - ./deploy/nginx/default.conf:/safe-config/default.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  restore:
    image: postgres:18-bookworm
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RESTORE_DIR: ${RESTORE_DIR:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
      RESTORE_ALLOW_NONEMPTY: ${RESTORE_ALLOW_NONEMPTY:-no}
    command: ["sh", "/ops/restore.sh"]
    volumes:
      - ./deploy/backup:/ops:ro
      - ./data/backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  manticore_data:
