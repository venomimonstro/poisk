services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poisk}
      POSTGRES_USER: ${POSTGRES_USER:-poisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poisk} -d ${POSTGRES_DB:-poisk}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  manticore:
    image: manticoresearch/manticore:29.9.0
    restart: unless-stopped
    environment:
      EXTRA: "1"
    volumes:
      - manticore_data:/var/lib/manticore
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST 'http://127.0.0.1:9308/sql?mode=raw' --data-urlencode 'query=SHOW STATUS' >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      manticore:
        condition: service_healthy
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres_data:
  manticore_data:
